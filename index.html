<style>
  :root {
    --ink: #f2f4fa;
    --muted: #a9b0c4;
    --accent: #ffd34d;
    --panel: rgba(10, 12, 22, .82);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #020308; color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  .title { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; pointer-events: none; }

    background: var(--panel); backdrop-filter: blur(10px);

  dialog {

            mask: radial-gradient(circle at var(--ix, 50%) var(--iy, 50%), transparent var(--r, 150vmax), #000 calc(var(--r, 150vmax) + 1px));

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   CONFIGURACIÓN — para añadir un juego nuevo, añade un objeto a GAMES.
   - url:   dirección pública del juego
   - prop:  'transit' | 'drives' | 'fiestective' | 'arcade' (máquina recreativa genérica)
   - color: color de la luz de su plataforma
   Los juegos se reparten solos por la superficie.
   ===================================================================== */
const OWNER = 'Diego';
const GAMES = [
  { id: 'little-transit', title: 'Little Transit', tagline: 'Diseña el transporte de ciudades de verdad, sin prisas.',
    url: 'https://diegomaartinez.github.io/city-game/', prop: 'transit', color: '#39c6ff' },
  { id: 'fiestective', title: 'Fiestective', tagline: 'Juegos de misterio para fiestas, con vuestros nombres.',
    url: 'https://fiestective.com/', prop: 'fiestective', color: '#ff4fb8' },
  { id: 'little-drives', title: 'Little Drives', tagline: 'Contrarreloj de coches: derrapa y bate a tu fantasma.',
    url: 'https://littledrives.com/', prop: 'drives', color: '#ff7a3d' },
  // { id: 'nuevo', title: 'Mi nuevo juego', tagline: '...', url: 'https://...', prop: 'arcade', color: '#7dff8a' },
];
const SHOW_COMING_SOON = true;

/* ---------------- física ---------------- */
const G = 1.62;          // gravedad lunar real (m/s²) — 1 unidad = 1 metro
const JUMP_V = 2.7;      // salto de un astronauta en la Luna: ~2,2 m de alto y ~3,3 s en el aire
const WALK = 4.2;        // velocidad al andar (m/s)
let R = 12;              // radio del planeta (m); crece solo si hay muchos juegos

/* ------------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const V3 = THREE.Vector3;
const NORTH = new V3(0, 1, 0);
const SUN = new V3(0.45, 0.8, 0.4).normalize();
const EARTH_DIR = new V3(-0.62, 0.3, -0.72).normalize();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#planetName').textContent = `PLANETA ${OWNER.toUpperCase()}`;
document.title = `Planeta ${OWNER} · Centro de juegos`;

await Promise.race([document.fonts.load('32px Silkscreen'), new Promise(r => setTimeout(r, 1500))]).catch(() => {});

const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#loading').innerHTML = 'Tu navegador no puede mostrar 3D.<br><br><a href="lobby-2d.html">Ir a la versión 2D</a>';
  throw e;
}
const DPR = Math.min(devicePixelRatio, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);

/* ---------------- utilidades ---------------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const emissive = (color, intensity = 2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: intensity, roughness: 1 });
const additive = (color, opacity) => new THREE.MeshBasicMaterial({
  color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
});
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function shadowAll(obj, cast = true, receive = true) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = receive; } });
  return obj;
}
const sph = (polarDeg, az) => {
  const p = THREE.MathUtils.degToRad(polarDeg);
  return new V3(Math.sin(p) * Math.cos(az), Math.cos(p), Math.sin(p) * Math.sin(az));
};
let seed = 11;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ---------------- ruido (para el terreno) ---------------- */
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1440662683);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w);
}
const fbm = (x, y, z) => vnoise(x, y, z) * 0.5 + vnoise(x * 2.1, y * 2.1, z * 2.1) * 0.27 + vnoise(x * 4.3, y * 4.3, z * 4.3) * 0.15;

/* ---------------- dónde va cada cosa ---------------- */
const slots = GAMES.map(g => ({ ...g }));
if (SHOW_COMING_SOON) slots.push({ id: 'soon', title: 'Próximamente', tagline: 'El siguiente juego está en construcción.', prop: 'soon', color: '#8a93b0', soon: true });
// Reparto en anillos alrededor del polo norte (donde aterrizas), con ~11 m entre juegos.
// Si no caben, el planeta crece: con 4-5 juegos mide 12 m de radio, con 10 unos 14,5 m, con 20 unos 19 m…
const SPACING = 11, FIRST_RING = 12, EDGE = THREE.MathUtils.degToRad(94);
let rings;
for (R = 12; ; R += 0.5) {
  rings = [];
  let left = slots.length;
  for (let p = FIRST_RING / R; p <= EDGE && left > 0; p += SPACING / R) {
    const cap = Math.max(1, Math.floor((2 * Math.PI * R * Math.sin(p)) / SPACING));
    const k = Math.min(cap, left);
    rings.push({ p, k });
    left -= k;
  }
  if (left === 0) break;
}
{
  let i = 0;
  rings.forEach((ring, ri) => {
    for (let j = 0; j < ring.k; j++, i++) {
      const az = (j / ring.k) * Math.PI * 2 + (ri % 2 ? Math.PI / ring.k : 0);
      slots[i].dir = sph(THREE.MathUtils.radToDeg(ring.p), az);
    }
  });
}
const SCALE = R / 12;
// los adornos cerca del polo van en los huecos entre los juegos del primer anillo
const gapAz = (g) => ((g % rings[0].k) + 0.5) * (Math.PI * 2 / rings[0].k);
const atArc = (m, az) => sph(THREE.MathUtils.radToDeg(m / R), az);
const DOME_DIR = atArc(6.3, gapAz(2) + (rings[0].k < 3 ? 2.2 : 0));
const MAST_DIR = atArc(4.6, gapAz(0));
const DISH_DIR = atArc(7.4, gapAz(1) + (rings[0].k < 2 ? 1.1 : 0));
// zonas planas (sin cráteres) y obstáculos
const flatZones = [
  { dir: NORTH, r: 2.6 }, { dir: DOME_DIR, r: 2.8 }, { dir: MAST_DIR, r: 1.2 }, { dir: DISH_DIR, r: 1.8 },
  ...slots.map(s => ({ dir: s.dir, r: 3.0 })),
];
const obstacles = [
  { dir: new V3(0, -1, 0), r: 4.8 * SCALE },
  { dir: DOME_DIR, r: 2.4 }, { dir: MAST_DIR, r: 0.5 }, { dir: DISH_DIR, r: 1.3 },
  ...slots.map(s => ({ dir: s.dir, r: 2.45 })),
];

/* ---------------- cráteres y altura del suelo ---------------- */
const craters = [];
for (let tries = 0; craters.length < Math.round(34 * SCALE * SCALE) && tries < 1200; tries++) {
  const dir = sph(4 + rand() * 96, rand() * Math.PI * 2);
  const r = 0.6 + Math.pow(rand(), 2) * 2.8;
  if (flatZones.some(z => dir.angleTo(z.dir) * R < z.r + r * 0.8)) continue;
  craters.push({ dir, r, depth: Math.min(0.32, 0.13 * r) });
}
const CAP_Y = -0.2;            // por debajo de esto empieza el casco metálico
const _gd = new V3();
function groundH(dir) {
  if (dir.y < CAP_Y) return 0;
  let h = (fbm(dir.x * 3 + 5, dir.y * 3, dir.z * 3) - 0.46) * 0.22 + (vnoise(dir.x * 14, dir.y * 14, dir.z * 14) - 0.5) * 0.05;
  for (const c of craters) {
    const d = Math.acos(THREE.MathUtils.clamp(dir.dot(c.dir), -1, 1)) * R;
    const t = d / c.r;
    if (t > 1.6) continue;
    if (t < 1) h -= (1 - t * t) * c.depth;
    h += c.depth * 0.38 * Math.exp(-(((t - 1) / 0.2) ** 2));
  }
  let m = 1;
  for (const z of flatZones) {
    const d = dir.angleTo(z.dir) * R;
    m = Math.min(m, THREE.MathUtils.smoothstep(d, z.r, z.r + 1.6));
  }
  m *= THREE.MathUtils.smoothstep(dir.y, CAP_Y, CAP_Y + 0.12);
  return h * m;
}

/* ---------------- cielo: vía láctea, estrellas, sol y Tierra ---------------- */
const NOISE_GLSL = `
  float hash(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 6; i++){ s += a * noise(p); p *= 2.03; a *= .5; } return s; }
`;
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 v; void main(){ v = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: NOISE_GLSL + `
    varying vec3 v;
    void main(){
      vec3 d = normalize(v);
      vec3 axis = normalize(vec3(.35, .85, -.4));
      float b = dot(d, axis);
      float band = exp(-b * b / .045);
      float n = fbm(d * 3.5);
      float lanes = smoothstep(.48, .66, fbm(d * 8. + 4.));
      vec3 col = vec3(.0025, .003, .007);
      col += band * (vec3(.010, .009, .012) + vec3(.026, .024, .03) * n * n) * (1. - lanes * .75);
      col += vec3(.05, .015, .045) * pow(fbm(d * 2. + 9.), 5.) * .25;
      col += vec3(.01, .025, .05) * pow(fbm(d * 2.5 - 3.), 5.) * .25;
      gl_FragColor = vec4(col, 1.);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), skyMat);
scene.add(sky);

function makeStars(n, size, bright) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const v = new V3(rand() * 2 - 1, rand() * 2 - 1, rand() * 2 - 1).normalize().multiplyScalar(1200);
    pos.set([v.x, v.y, v.z], i * 3);
    c.setHSL([0.6, 0.08, 0.13, 0.58][i % 4], 0.35, 0.8);
    const k = bright * (0.4 + rand() * 0.6);
    col.set([c.r * k, c.g * k, c.b * k], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false }));
}
sky.add(makeStars(4500, 1.2, 0.9), makeStars(220, 1.8, 2.2));

const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, 'rgba(255,250,235,.9)');
  gr.addColorStop(0.3, 'rgba(255,220,170,.18)'); gr.addColorStop(1, 'rgba(255,200,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(6, 5.6, 5), blending: THREE.AdditiveBlending, depthWrite: false }));
sunSprite.scale.setScalar(260);
sky.add(sunSprite);
sunSprite.position.copy(SUN).multiplyScalar(1100);

// la Tierra
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(80, 96, 64),
  new THREE.ShaderMaterial({
    uniforms: { sunDir: { value: SUN }, time: { value: 0 } },

function orient(obj, dir, h = 0, yaw = 0, onGround = true) {
  const y = dir.clone().normalize();
  const z = NORTH.clone().sub(y.clone().multiplyScalar(y.dot(NORTH)));
  if (z.lengthSq() < 1e-6) z.set(0, 0, 1);
  z.normalize();
  const x = new V3().crossVectors(y, z);
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  if (yaw) obj.rotateY(yaw);
  obj.position.copy(y).multiplyScalar(R + h + (onGround ? groundH(y) : 0));
  return obj;
}

function windowsTex(cols, rows, facade, lit, glowOnly) {
  return canvasTex(cols * 16, rows * 16, (g, w, h) => {
    g.fillStyle = glowOnly ? '#000' : facade; g.fillRect(0, 0, w, h);
    let n = 0;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      n++;
      const on = hash3(x, y, cols * 7 + rows) > 0.3;
      g.fillStyle = on ? lit : (glowOnly ? '#000' : '#0b0d12');
      g.fillRect(x * 16 + 4, y * 16 + 3, 8, 10);
    }
  });
}
function building(w, h, d, facade, lit) {
  const cols = Math.max(2, Math.round(w * 6)), rows = Math.max(2, Math.round(h * 5));
  const map = windowsTex(cols, rows, facade, lit, false), glow = windowsTex(cols, rows, facade, lit, true);
  const side = std(0xffffff, { map, emissive: 0xffffff, emissiveMap: glow, emissiveIntensity: 1.6, roughness: 0.5, metalness: 0.2 });
  const roof = std(0x2c2f36, { roughness: 0.8 });
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, roof, roof, side, side]);
}

function kickDust(n, strength) {
  const pos = player.position.clone();
  const right = new V3().crossVectors(st.facing, st.up);
  for (let i = 0; i < n; i++) {
    const s = dust[dustIdx++ % dust.length];
    const a = rand() * Math.PI * 2;
    const dirT = st.facing.clone().multiplyScalar(Math.cos(a)).addScaledVector(right, Math.sin(a));
    s.position.copy(pos).addScaledVector(dirT, 0.2);
    // sin aire, el polvo vuela en parábola y vuelve a caer: no hace nubes
    s.userData.vel.copy(dirT).multiplyScalar(strength * (0.5 + rand())).addScaledVector(st.up, strength * (0.4 + rand() * 0.6));
    s.userData.life = 0;
    s.userData.max = 0.9 + rand() * 0.8;
    s.scale.setScalar(0.12 + rand() * 0.12);
    s.visible = true;
  }
}
function stamp(sideSign) {
  const m = prints[printIdx++ % prints.length];
  const right = new V3().crossVectors(st.facing, st.up).multiplyScalar(0.12 * sideSign / R);
  const dir = st.up.clone().add(right).normalize();
  const x = new V3().crossVectors(dir, st.facing).normalize();
  const z = new V3().crossVectors(x, dir);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, dir, z));
  m.position.copy(dir).multiplyScalar(R + groundH(dir) + 0.012);
  m.material.opacity = 0.55;
  m.userData.age = 0;
  m.visible = true;
}

let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.hypot(dx, e.clientY - drag.y) > 6) { drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved) {
    st.camFwd.applyAxisAngle(st.up, -dx * 0.006).normalize();
    drag.x = e.clientX; drag.y = e.clientY;
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (!drag) return;
  canvas.classList.remove('dragging');
  if (!drag.moved) tapAt(e.clientX, e.clientY);
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });

const ray = new THREE.Raycaster();

function tapAt(x, y) {
  ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObjects([...hitMeshes, cap, hull], false);
  if (!hits.length) return;
  const slot = hits[0].object.userData.slot;
  if (slot) {
    if (slot === near) { enter(slot); return; }
    target = { dir: slot.dir.clone(), stop: 3.3 };
  } else {
    const dir = hits[0].point.clone().normalize();
    target = { dir, stop: 0.3 };
    orient(marker, dir, 0.05);
    marker.rotateX(Math.PI / 2);
    marker.visible = true;
    marker.userData.t = 0;
  }
  stuckTime = 0;
}

$('#playBtn').addEventListener('click', () => near && enter(near));
function enter(s) {
  if (entering || s.soon || !s.url) return;
  entering = true;
  keys.clear(); target = null;
  parts.jet.visible = true;
  st.vh = Math.max(st.vh, 1.5);
  const iris = $('#iris');
  const p = player.position.clone().project(camera);
  iris.style.setProperty('--ix', ((p.x + 1) / 2) * innerWidth + 'px');
  iris.style.setProperty('--iy', ((1 - p.y) / 2) * innerHeight + 'px');
  if (reduceMotion) { location.href = s.url; return; }
  iris.classList.add('closing');
  const start = performance.now(), from = Math.hypot(innerWidth, innerHeight);
  (function shrink(t) {
    const k = Math.min(1, (t - start) / 1100);
    iris.style.setProperty('--r', from * (1 - k * k) + 'px');
    if (k < 1) requestAnimationFrame(shrink); else location.href = s.url;
  })(start);
}
addEventListener('pageshow', (e) => {
  if (e.persisted) {
    entering = false; parts.jet.visible = false;
    $('#iris').classList.remove('closing');
    $('#iris').style.setProperty('--r', '150vmax');
  }
});

/* ---------------- lista accesible ---------------- */
const host = (u) => { try { return new URL(u).host + new URL(u).pathname.replace(/\/$/, ''); } catch { return u; } };
$('#listItems').innerHTML = GAMES.map(g =>
  `<li><a href="${g.url}" style="--c:${g.color}">${g.title}<small>${g.tagline}</small></a></li>`).join('');
$('#listBtn').addEventListener('click', () => { keys.clear(); $('#list').showModal(); });
$('#closeList').addEventListener('click', () => $('#list').close());

/* ---------------- movimiento sobre la esfera ---------------- */
const tmpQ = new THREE.Quaternion(), tmpV = new V3(), tmpV2 = new V3();
function rotateAll(q) {
  st.up.applyQuaternion(q).normalize();
  st.facing.applyQuaternion(q);
  st.camFwd.applyQuaternion(q);
  st.vel.applyQuaternion(q);
}

function updatePlayer(dt) {
  let ix = 0, iz = 0;
  keys.forEach(k => { ix += MOVE[k][0]; iz += MOVE[k][1]; });
  const want = new V3();
  if (!entering) {
    if (ix || iz) {
      const right = tmpV.crossVectors(st.camFwd, st.up);
      want.addScaledVector(st.camFwd, iz).addScaledVector(right, ix);
    } else if (target) {
      const dist = st.up.angleTo(target.dir) * R;
      if (dist < target.stop) { target = null; marker.visible = false; }
      else want.copy(target.dir).projectOnPlane(st.up);
    }
  }
  if (want.lengthSq() > 1e-6) want.normalize().multiplyScalar(WALK);

  // en el suelo controlas bien; en el aire casi nada (inercia)
  const accel = onGround ? 9 : 0.9;
  st.vel.lerp(want, Math.min(1, accel * dt)).projectOnPlane(st.up);
  const speed = st.vel.length();

  if (speed > 0.02) {
    const dir = st.vel.clone().divideScalar(speed);
    if (want.lengthSq() > 0) {
      const face = want.clone().normalize();
      if (st.facing.dot(face) < -0.9) st.facing.copy(face); else st.facing.lerp(face, Math.min(1, dt * 8));
    }
    const before = st.up.clone();
    rotateAll(tmpQ.setFromAxisAngle(tmpV2.crossVectors(st.up, dir).normalize(), (speed * dt) / R));
    for (const o of obstacles) {
      const ang = st.up.angleTo(o.dir), min = o.r / R;
      if (ang < min) {
        const ax = tmpV2.crossVectors(o.dir, st.up);
        if (ax.lengthSq() < 1e-9) continue;
        rotateAll(tmpQ.setFromAxisAngle(ax.normalize(), min - ang));
        const n = st.up.clone().sub(o.dir).projectOnPlane(st.up).normalize();
        const into = st.vel.dot(n);
        if (into < 0) st.vel.addScaledVector(n, -into);
      }
    }
    if (target) {
      stuckTime = before.angleTo(st.up) * R < speed * dt * 0.2 ? stuckTime + dt : 0;
      if (stuckTime > 0.5) { target = null; marker.visible = false; }
    }
    if (onGround) {
      st.stepDist += speed * dt;
      if (st.stepDist > 0.62) { st.stepDist = 0; st.stepSide *= -1; stamp(st.stepSide); kickDust(2, 0.35); }
    }
  }
  st.facing.projectOnPlane(st.up).normalize();
  st.camFwd.projectOnPlane(st.up).normalize();

  // gravedad lunar
  const ground = groundH(st.up);
  if (onGround && st.vh <= 0) {
    if (st.alt - ground > 0.12) onGround = false;     // te sales de un borde: empiezas a flotar hacia abajo
    else st.alt = ground;
  }
  if (!onGround) {
    st.vh -= G * dt;
    st.alt += st.vh * dt;
    if (st.alt <= ground) {
      if (st.vh < -1.2) kickDust(Math.min(14, Math.round(-st.vh * 4)), Math.min(1.4, -st.vh * 0.35));
      st.alt = ground; st.vh = 0; onGround = true;
    }
  }
  if (entering) { st.vh = Math.min(st.vh + 9 * dt, 9); onGround = false; }

  player.position.copy(st.up).multiplyScalar(R + st.alt);
  const x = tmpV.crossVectors(st.up, st.facing);
  player.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, st.up, st.facing));

  // animación: zancadas lentas en el suelo, piernas recogidas en el aire
  const walking = onGround && speed > 0.3;
  st.walkPhase += dt * (walking ? speed * 2.1 : 0);
  const sw = walking ? Math.sin(st.walkPhase) * 0.55 : 0;
  const airPose = onGround ? 0 : 1;
  const L = THREE.MathUtils.lerp;
  parts.legL.rotation.x = L(parts.legL.rotation.x, sw - airPose * 0.35, 0.15);
  parts.legR.rotation.x = L(parts.legR.rotation.x, -sw + airPose * 0.15, 0.15);
  parts.armL.rotation.x = L(parts.armL.rotation.x, -sw * 0.6, 0.15);
  parts.armR.rotation.x = L(parts.armR.rotation.x, sw * 0.6, 0.15);
  parts.armL.rotation.z = L(parts.armL.rotation.z, -0.25 - airPose * 0.5, 0.08);
  parts.armR.rotation.z = L(parts.armR.rotation.z, 0.25 + airPose * 0.5, 0.08);
  parts.body.position.y = walking ? Math.abs(Math.sin(st.walkPhase)) * 0.04 : 0;
  parts.body.rotation.x = L(parts.body.rotation.x, walking ? 0.12 : 0, 0.1);
}

/* ---------------- cámara ---------------- */
const camPos = new V3(), camUp = new V3(0, 1, 0);
let camReady = false;
function updateCamera(dt) {
  const height = st.camDist * 0.55;
  const want = st.up.clone().multiplyScalar(R + height + st.alt * 0.6).addScaledVector(st.camFwd, -st.camDist);
  const k = camReady ? 1 - Math.exp(-dt * 5) : 1;
  camPos.lerp(want, k);
  camUp.lerp(st.up, k).normalize();
  camReady = true;
  camera.position.copy(camPos);
  camera.up.copy(camUp);
  camera.lookAt(st.up.clone().multiplyScalar(R + 1.4 + st.alt * 0.75).addScaledVector(st.camFwd, 2));
  sky.position.copy(camera.position);

  // la sombra se calcula alrededor del astronauta; el sol no se mueve
  sun.target.position.copy(st.up).multiplyScalar(R);
  sun.position.copy(sun.target.position).addScaledVector(SUN, 50);
}

/* ---------------- etiquetas y cercanía ---------------- */
const proj = new V3();
function occluded(point) {
  const o = camera.position, d = tmpV.subVectors(point, o);
  const len = d.length(); d.divideScalar(len);
  const b = o.dot(d), c = o.lengthSq() - (R * 0.97) ** 2, disc = b * b - c;
  if (disc <= 0) return false;
  const t = -b - Math.sqrt(disc);
  return t > 0 && t < len;
}
function updateLabels() {
  let best = null, bestD = 4.2;
  for (const s of slots) {
    const d = st.up.angleTo(s.dir) * R;
    if (d < bestD) { best = s; bestD = d; }
  }
  if (best !== near) {
    near?.label.classList.remove('near');
    near = best;
    if (near) {
      near.label.classList.add('near');
      $('#cardTitle').textContent = near.title;
      $('#cardText').textContent = near.tagline;
      $('#cardUrl').textContent = near.url ? host(near.url) : '';
      $('#card').style.setProperty('--c', near.color);
      $('#playBtn').disabled = !!near.soon;
      $('#playBtn').textContent = near.soon ? 'Pronto' : 'Jugar ▶';
    }
    $('#card').classList.toggle('show', !!near);
    document.body.classList.toggle('card-open', !!near);
  }
  for (const s of slots) {
    const p = s.dir.clone().multiplyScalar(R + 5);
    proj.copy(p).project(camera);
    const hidden = proj.z > 1 || occluded(p);
    s.label.style.opacity = hidden ? 0 : 1;
    if (!hidden) s.label.style.transform = `translate(${((proj.x + 1) / 2) * innerWidth}px, ${((1 - proj.y) / 2) * innerHeight}px) translate(-50%, -100%)`;
  }
}

/* ---------------- animaciones del mundo ---------------- */
function animateWorld(t, dt) {
  const slow = reduceMotion ? 0.2 : 1;
  for (const s of slots) {
    const isNear = s === near;
    const u = s.prop.userData;
    if (u.spin) u.spin.rotation.y += dt * (u.spinSpeed || 1) * slow;
    if (u.float) u.float.position.y = 1.75 + Math.sin(t * 1.3) * 0.08 * slow;
    if (!u.noBob) s.prop.position.y = 0.27 + (isNear ? Math.sin(t * 2) * 0.04 : 0);
    s.beam.material.opacity = THREE.MathUtils.lerp(s.beam.material.opacity, isNear ? 0.32 : 0.13 + Math.sin(t * 1.5) * 0.02, 0.08);
    s.ring.material.emissiveIntensity = isNear ? 5 + Math.sin(t * 6) : 3;
  }
  blinkers.forEach(b => { b.visible = Math.sin(t * 2.2 + b.userData.phase * 0.7) > 0; });
  mastLight.visible = (t % 1.6) < 0.15;
  dish.userData.head.rotation.y = t * 0.25 * slow;
  const e = engine.userData, f = 1 + Math.sin(t * 31) * 0.05 + Math.sin(t * 13) * 0.04;
  e.flame.scale.set(1, f, 1); e.core.scale.set(1, 2 - f, 1);
  e.light.intensity = 110 + Math.sin(t * 23) * 15;
  earth.rotation.y += dt * 0.01;
  earth.material.uniforms.time.value = t;
  if (marker.visible) {
    marker.userData.t += dt;
    marker.scale.setScalar(1 + marker.userData.t * 0.8);
    marker.material.opacity = Math.max(0, 1 - marker.userData.t);
  }
  for (const m of prints) {
    if (!m.visible) continue;
    m.userData.age += dt;
    if (m.userData.age > 25) { m.material.opacity -= dt * 0.1; if (m.material.opacity <= 0) m.visible = false; }
  }
  for (const s of dust) {
    if (!s.visible) continue;
    const u = s.userData;
    u.life += dt;
    const n = s.position.clone().normalize();
    u.vel.addScaledVector(n, -G * dt);
    s.position.addScaledVector(u.vel, dt);
    const gr = R + groundH(n);
    if (s.position.length() < gr) { s.position.copy(n).multiplyScalar(gr); u.vel.multiplyScalar(0.2); }
    s.material.opacity = 0.7 * (1 - u.life / u.max);
    if (u.life > u.max) s.visible = false;
  }
}

/* ---------------- render ---------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.55, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(DPR);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth / 2, innerHeight / 2);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 68 : 52;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  updatePlayer(dt);
  updateCamera(dt);
  animateWorld(t, dt);
  updateLabels();
  composer.render();
  if (first) {
    first = false;
    window.__lobbyReady = true;
    $('#loading').classList.add('gone');
  }
});
</script>
</body>
</html>
